<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
</head>

<body>
    <header>
        <h1>Pesquisa Online</h1>
    </header>

    <section>

        <!-- Dados Pessoais -->

        <form action="URL" method="get">
            <fieldset>
                <legend>Dados Pessoais</legend>

                <label for="userName" >Nome</label>
                <input type="text" name="userName" required>
                <br>

                <label for="userAge">Idade</label>
                <input type="number" name="userAge" min="12" max="100" required>
                <br>

                <label for="birthDate">Data de Nascimento</label>
                <input type="date" name="birthDate" required>
                <br>

                <label for="userEmail">Email</label>
                <input type="email" name="userEmail" required>
                <br>

                <label for="userPhoneNumber">Telefone</label>
                <input type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD + numero sem espaços ou hífen">
                <br>

                <label for="userImage">Upload de Foto</label>
                <input type="file" accept="image/*" name="userImage">
                <br>

             </fieldset>
            

            <fieldset>
                <legend>Perfil</legend>

                <p>Gênero:</p>
                <input type="radio" name="userGender" value="Feminino">
                <label for="userGender">Feminino</label>
                <br>

                <input type="radio" name="userGender" value="Masculino">
                <label for="userGender">Masculino</label>
                <br>
                
                <input type="radio" name="userGender" value="notInformed">
                <label for="userGender">Prefiro Não Informar</label>
                <br>
            
               
                <select name="maritalStatus">
                    <legend>Estado Civil</legend>
                    <label for="maritalStatus">Estado Civil:</label>
                    <option value="notInformed">Selecione</option>
                    <option value="casado">Casado</option>
                    <option value="solteiro">Solteiro</option>
                    <option value="divorciado">Divorciado</option>
                    <option value="uniaoEstavel">União Estável</option>
                </select>
                <br>

                <select name="userState" id="state">
                    <label for="state">Estado</label>
                    <option value="userState">Selecione</option>
                    <option value="acre"> Acre </option>
                    <option value="ualagoas">Alagoas</option>
                    <option value="amapa">Amapá</option>
                    <option value="amazonas">Amazonas</option>
                    <option value="bahia">Bahia</option>
                    <option value="userState">Ceará</option>
                    <option value="distritoFederal">Distrito Federal</option>
                    <option value="espiritoSanto">Espirito Santo</option>
                    <option value="goias">Goiás</option>
                    <option value="maranhao">Maranhão</option>
                    <option value="matoGrossoDoSul">Mato Grosso do Sul</option>
                    <option value="matoGrosso">Mato Grosso</option>
                    <option value="minasGerais">Minas Gerais</option>
                    <option value="para">Pará</option>
                    <option value="paraiba">Paraíba</option>
                    <option value="parana">Paraná</option>
                    <option value="pernambuco">Pernambuco</option>
                    <option value="userState">Piauí</option>
                    <option value="rioDeJaneiro">Rio de Janeiro</option>
                    <option value="rioGrandeDoSul">Rio Grande do Norte</option>
                    <option value="userState">Rio Grande do Sul</option>
                    <option value="userState">Rondônia</option>
                    <option value="userState">Roraima</option>
                    <option value="userState">Santa Catarina</option>
                    <option value="userState">São Paulo</option>
                    <option value="userState">Sergipe</option>
                    <option value="userState">Tocantins</option>
                </select>
                <br>

                </fieldset>

               <fieldset>
                <label for="musicStyle">Estilo Musical</label>
                <input id="musicStyle" type="text" name="userMusicStyle">
                </fieldset>





            
            


            <button type="submit">Enviar</button>

            
            

        </form>
    </section>

    <section>
        <form action="URL" method="get"></form>
        
    </section>
    
</body>
</html>
